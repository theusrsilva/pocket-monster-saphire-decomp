# Configuração do lovebrew (https://lovebrew.org) para gerar os binários do LÖVE Potion.
# Conferir com a versão do lovebrew em uso: os nomes das chaves mudaram entre versões.
[metadata]
title = "Saphire Recomp"
author = "theusrsilva"
description = "Recriação de Pocket Monster Saphire (precisa da sua ROM)"
version = "0.1.0"

[build]
targets = ["ctr", "hac"]   # ctr = 3DS (duas telas), hac = Switch
source = "game"
